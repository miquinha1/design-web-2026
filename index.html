<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 1 – Tailwind</title>

    <!-- Tailwind CSS v4 (browser) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-green-700 text-white">

        <div class="mx-auto max-w-7xl px-4">

            <!-- LOGO + AÇÕES -->
            <div class="flex items-center justify-between py-4">

                <!-- LOGO + SLOGAN -->
                <div>
                    <h1 class="text-xl font-bold md:text-3xl">
                        <a href="/"
                            title="Instituto Federal de Educação, Ciência e Tecnologia do Estado do Rio Grande do Norte"
                            class="no-underline">
                            INSTITUTO FEDERAL
                        </a>
                    </h1>

                    <p class="hidden text-sm md:block">
                        Educação, Ciência, Cultura e Tecnologia em todo o Rio Grande do Norte
                    </p>
                </div>

                <!-- MENU HAMBÚRGUER (mobile) -->
                <button id="menuToggle"
                    aria-label="Menu"
                    class="bg-transparent border-none p-2 text-2xl md:hidden">
                    <i class="ph ph-list"></i>
                </button>

                <!-- AÇÕES (ícones, busca, contraste, modo escuro) -->
                <div class="hidden items-center gap-3 md:flex">

                    <!-- Ícones sociais -->
                    <div class="flex items-center gap-2">

                        <a href="#" aria-label="Instagram"
                            class="flex h-10 w-10 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-instagram-logo"></i>
                        </a>

                        <a href="#" aria-label="Twitter"
                            class="flex h-10 w-10 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-twitter-logo"></i>
                        </a>

                        <a href="#" aria-label="LinkedIn"
                            class="flex h-10 w-10 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-linkedin-logo"></i>
                        </a>

                        <a href="#" aria-label="YouTube"
                            class="flex h-10 w-10 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-youtube-logo"></i>
                        </a>

                        <a href="#" aria-label="Spotify"
                            class="flex h-10 w-10 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-spotify-logo"></i>
                        </a>

                        <a href="#" aria-label="TikTok"
                            class="flex h-10 w-10 items-center justify-center rounded-full border border-white transition hover:bg-white hover:text-green-700">
                            <i class="ph ph-tiktok-logo"></i>
                        </a>

                    </div>

                    <!-- Busca -->
                    <form id="busca"
                        method="get"
                        action="/search/"
                        class="flex items-center overflow-hidden rounded-full bg-gray-100">

                        <input
                            type="search"
                            name="query"
                            placeholder="Busca"
                            aria-label="Busca"
                            class="w-32 bg-transparent px-3 py-2 text-gray-700 outline-none" />

                        <button type="submit"
                            aria-label="Pesquisar"
                            class="px-3 text-gray-700">
                            <i class="ph ph-magnifying-glass"></i>
                        </button>

                    </form>

                    <!-- Alto contraste -->
                    <button id="altocontraste"
                        type="button"
                        aria-label="Alto contraste"
                        class="flex h-10 w-10 items-center justify-center rounded-full border border-white bg-transparent transition hover:bg-white hover:text-green-700">
                        <i class="ph ph-circle-half"></i>
                    </button>

                    <!-- Modo escuro -->
                    <button type="button"
                        aria-label="Modo escuro"
                        class="flex h-10 w-10 items-center justify-center rounded-full border border-white bg-transparent transition hover:bg-white hover:text-green-700">
                        <i class="ph ph-moon"></i>
                    </button>

                </div>

            </div>

            <!-- NAVEGAÇÃO PRINCIPAL (desktop) -->
            <nav aria-label="Navegação principal"
                class="hidden border-t border-white/30 md:block">

                <ul class="flex items-center gap-6 py-4">

                    <li><a href="#" class="font-bold transition hover:text-green-200">Processos seletivos</a></li>
                    <li><a href="#" class="font-bold transition hover:text-green-200">Cursos</a></li>
                    <li><a href="#" class="font-bold transition hover:text-green-200">Campi</a></li>
                    <li><a href="#" class="font-bold transition hover:text-green-200">Institucional</a></li>
                    <li><a href="#" class="font-bold transition hover:text-green-200">Acesso à Informação</a></li>
                    <li><a href="#" class="font-bold transition hover:text-green-200">Eventos</a></li>
                    <li><a href="#" class="font-bold transition hover:text-green-200">Serviços</a></li>

                </ul>
            </nav>

        </div>

    </header>

</body>

</html>
