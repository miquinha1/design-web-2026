<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição Vue</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="min-h-screen bg-base-200 flex items-center justify-center p-6">

    <div id="app" class="card bg-base-100 shadow-xl w-full max-w-md">
        <div class="card-body">
            <!-- título da página -->
            <h1 class="card-title justify-center text-2xl mb-2">
                Inscrição em oficina
            </h1>

            <!-- Formulário de inscrição -->
            <form class="space-y-4" v-if="!confirmado" @submit.prevent="confirmarInscricao">

                <!-- v-model: ligar input ao estado -->
                <div>
                    <label for="nome" class="block font-semibold mb-1">Nome</label>
                    <input id="nome" type="text" class="input w-full" v-model="nome" @blur="validarNome" :class="{'input-error': erroNome}">
                    <p id="erro-nome" v-if="erroNome" class="text-error text-sm mt-1">Informe seu nome</p>
                </div>

                <div>
                    <label for="email" class="block font-semibold mb-1">E-mail</label>
                    <input id="email" type="text" class="input w-full" v-model="email" @blur="validarEmail" :class="{'input-error': erroEmail}">
                    <p id="erro-email" v-if="erroEmail" class="text-error text-sm mt-1">Informe um e-mail válido</p>
                </div>

                <button type="submit" class="btn btn-primary w-full">Confirmar inscrição</button>
            </form>

            <!-- área de resultado -->
            <div v-else class="space-y-4">
                <div class="alert alert-success">Inscrição confirmada!</div>
                <div class="bg-base-200 rounded-box p-4 space-y-2">
                    <p><strong>Nome:</strong> {{ nome }}</p>
                    <p class="break-words"><strong>E-mail:</strong> {{ email }}</p>
                </div>
                <button type="button" class="btn btn-outline w-full" @click="editarInscricao">Editar</button>
            </div>
        </div>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    nome: '',
                    email: '',
                    erroNome: false,
                    erroEmail: false,
                    confirmado: false // controla qual tela é exibida
                }
            },

            // funções (métodos) para o nosso app
            methods: {
                // remove as mensagens de erro
                limparErros() {
                    this.erroNome = false;
                    this.erroEmail = false;
                },

                // valida somente o nome
                validarNome() {
                    this.erroNome = this.nome.trim() === '';
                },

                // valida somente o e-mail
                validarEmail() {
                    this.erroEmail = this.email.trim() === '' || !this.email.includes('@');
                },

                // valida os dois campos (usado no envio do formulário)
                validarCampos() {
                    this.validarNome();
                    this.validarEmail();
                    return !this.erroNome && !this.erroEmail;
                },

                // só confirma se os campos forem válidos
                confirmarInscricao() {
                    if (this.validarCampos()) {
                        this.confirmado = true;
                    }
                },

                // volta para o formulário mantendo o que foi digitado
                editarInscricao() {
                    this.limparErros();
                    this.confirmado = false;
                }
            }
        }).mount("#app");
    </script>
</body>
</html>
